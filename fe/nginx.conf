server {
    listen 80;
    server_name localhost;

    # Nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Thư mục chứa mã nguồn Frontend đã build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hỗ trợ SPA Routing (React Router / Hash / HTML5 History)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy cho Backend API và luồng SSE realtime
    location /api/ {
        proxy_pass http://be:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình đặc thù cho Server-Sent Events (SSE): KHÔNG BUFFER VÀ KHÔNG TIMEOUT
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # Cache tĩnh cho ảnh, font, css, js
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
