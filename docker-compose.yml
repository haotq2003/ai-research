services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: ai_research_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_research_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: research_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: research_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/ai_research_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-ai_research_super_secret_jwt_key_2026}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: research_frontend
    restart: always
    depends_on:
      - be
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata: